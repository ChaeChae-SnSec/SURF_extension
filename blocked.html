<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>SURF - Blocked</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #0A1120;
            --bg-bottom: #060A13;
            --card-bg: #101828;
            --card-border: rgba(143, 232, 224, 0.12);
            --text-main: #eef2f7;
            --text-dim: #93a0b4;
            --accent-teal: #8FE8E0;
            --accent-blue: #2E6FE0;
            --brand-gradient: linear-gradient(90deg, var(--accent-teal), var(--accent-blue));
            --danger: #ef4444;
            --warning: #f97316;
            --gray-light: #1c2636;
        }

        body {
            margin: 0;
            background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
            font-family: 'Poppins', 'Pretendard', -apple-system, sans-serif;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            width: 400px;
            /* 가로를 살짝 넓혀 텍스트 공간 확보 */
            padding: 40px 30px;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        /* 게이지 스타일 (이전과 동일) */
        .gauge-container {
            position: relative;
            width: 240px;
            height: 120px;
            margin: 0 auto 20px;
            overflow: hidden;
        }

        .gauge-bg {
            position: absolute;
            width: 240px;
            height: 240px;
            border: 25px solid var(--gray-light);
            border-radius: 50%;
            box-sizing: border-box;
        }

        .gauge-fill {
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;

            background: conic-gradient(var(--color) 0deg,
                    var(--color) calc(var(--percent) * 1.8deg),
                    var(--gray-light) 0deg);

            transform: rotate(-90deg);
        }

        .gauge-fill::after {
            content: "";
            position: absolute;
            width: 190px;
            height: 190px;
            background: var(--card-bg);
            border-radius: 50%;
            top: 25px;
            left: 25px;
        }

        .gauge-text {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
        }

        #risk-level {
            font-size: 28px;
            font-weight: 800;
            color: #9ca3af;
            margin-bottom: -5px;
        }

        #prob-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--warning);
        }

        .label {
            font-size: 12px;
            color: var(--text-dim);
            letter-spacing: 1px;
            margin-top: 30px;
            font-weight: bold;
        }

        .domain {
            font-size: 22px;
            font-weight: 800;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 10px 0 30px;
            word-break: break-all;
        }

        /* 동의 박스 - 단어 안 잘리게 설정 */
        .consent-box {
            background-color: rgba(239, 68, 68, 0.08);
            padding: 20px;
            border-radius: 20px;
            display: flex;
            gap: 15px;
            align-items: flex-start;
            text-align: left;
            margin-bottom: 20px;
        }

        .consent-box input[type="checkbox"] {
            min-width: 20px;
            min-height: 20px;
            margin-top: 3px;
            cursor: pointer;
        }

        .consent-text {
            font-size: 13px;
            color: #e08a8a;
            line-height: 1.6;
            word-break: keep-all;
            /* 단어 단위 줄바꿈 핵심! */
            letter-spacing: -0.2px;
            /* 띄어쓰기 간격 최적화 */
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            margin-top: 20px;
        }

        .btn-action-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn-proceed,
        .btn-perm {
            flex: 1;
            padding: 12px 5px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: not-allowed;
            border: 1px solid transparent;
            background-color: var(--gray-light);
            color: #5b6b82;
            transition: all 0.3s ease;
        }

        .btn-proceed.active {
            background: var(--brand-gradient);
            color: #06121a;
            cursor: pointer;
        }

        .btn-proceed.active:hover {
            filter: brightness(1.08);
        }

        .btn-perm.active {
            background: transparent;
            border: 1px solid var(--accent-teal);
            color: var(--accent-teal);
            cursor: pointer;
        }

        .btn-perm.active:hover {
            background: rgba(143, 232, 224, 0.1);
        }

        .report-section {
            margin-top: 8px;
            text-align: center;
        }

        .btn-report {
            background: none;
            color: var(--text-dim);
            border: none;
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
            padding: 5px;
        }

        .btn-report:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .report-desc {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 6px;
        }

        .footer {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 10px;
            word-break: keep-all;
        }

        .src-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: var(--accent-teal);
            background: rgba(143, 232, 224, 0.1);
            border-radius: 999px;
            padding: 4px 12px;
            margin-bottom: 4px;
        }

        /* alert() 대신 쓰는 인라인 안내. 모달이 뜨면 시연 흐름이 끊긴다. */
        .status-msg {
            font-size: 13px;
            font-weight: 600;
            border-radius: 12px;
            padding: 12px 14px;
            margin-top: 16px;
            line-height: 1.5;
            word-break: keep-all;
            display: none;
        }

        .status-msg.show {
            display: block;
        }

        .status-msg.ok {
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
        }

        .status-msg.err {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="gauge-container">
            <div class="gauge-bg"></div>
            <div id="gauge-fill" class="gauge-fill"></div>
            <div class="gauge-text">
                <div id="risk-level">-</div>
                <div id="prob-value">분석 중...</div>
            </div>
        </div>

        <div class="src-badge" id="src-badge">SURF</div>
        <div class="label">BLOCKED DOMAIN</div>
        <div class="domain" id="domain-name">...</div>

        <div class="consent-box">
            <input type="checkbox" id="agree-check">
            <label for="agree-check" class="consent-text">
                본인은 해당 웹사이트 접속 시 발생할 수 있는 보안 위협 및 피해 가능성을 충분히 숙지하였으며, 이에 따른 모든 책임은 사용자 본인에게 있음을 확인합니다.
            </label>
        </div>

        <div class="btn-group">
            <div class="btn-action-row">
                <button id="btn-temp" class="btn-proceed" disabled>30분 임시 허용</button>
                <button id="btn-perm" class="btn-perm" disabled>영구 허용</button>
            </div>

            <div class="footer">위험 수치가 높을 경우 접속하지 않는 것을 권장합니다.</div>

            <div class="report-section">
                <button id="btn-report" class="btn-report">🚨 오탐인가요? 신고하기</button>
                <div class="report-desc">신고 시 보안 분석 팀에 도메인이 전달됩니다.</div>
            </div>
        </div>

        <div class="status-msg" id="status-msg"></div>
    </div>

    <script type="module" src="blocked.js"></script>
</body>

</html>
