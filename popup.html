<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>SURF</title>
    <style>
        :root {
            --bg-top: #0A1120;
            --bg-bottom: #060A13;
            --card-bg: #101828;
            --card-border: rgba(143, 232, 224, 0.12);
            --text-main: #eef2f7;
            --text-dim: #93a0b4;
            --accent-teal: #8FE8E0;
            --accent-blue: #2E6FE0;
            --brand-gradient: linear-gradient(90deg, var(--accent-teal), var(--accent-blue));
            --off-gray: #3a4557;
        }

        body {
            margin: 0;
            width: 260px;
            background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', sans-serif;
            color: var(--text-main);
            word-break: keep-all;
            border-radius: 30px;
            overflow: hidden;
        }

        .wrap {
            padding: 20px;
        }

        h1 {
            font-size: 18px;
            margin: 0 0 2px;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }

        .subtitle {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 18px;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            padding: 14px 16px;
        }

        .status {
            flex: 1;
            min-width: 0;
        }

        .status-text {
            font-size: 14px;
            font-weight: 600;
        }

        .status-text.on { color: var(--accent-teal); }
        .status-text.off { color: var(--text-dim); }

        .status-sub {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        /* 토글 스위치 */
        .switch {
            position: relative;
            width: 46px;
            height: 26px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: var(--off-gray);
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .slider::before {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            left: 3px;
            top: 3px;
            background: var(--text-main);
            border-radius: 50%;
            transition: transform 0.2s ease;
        }

        input:checked + .slider {
            background: var(--accent-teal);
        }

        input:checked + .slider::before {
            transform: translateX(20px);
            background: var(--bg-top);
        }

        .footer {
            margin-top: 14px;
            font-size: 11px;
            color: var(--text-dim);
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>SURF</h1>
        <div class="subtitle">AI 악성 도메인 탐지</div>

        <div class="row">
            <div class="status">
                <div class="status-text" id="statusText">확인 중...</div>
                <div class="status-sub" id="statusSub"></div>
            </div>
            <label class="switch">
                <input type="checkbox" id="toggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="footer">끄면 이 브라우저에서 도메인 검사를 하지 않습니다.</div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
